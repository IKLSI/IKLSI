<svg xmlns="http://www.w3.org/2000/svg" width="960" height="364" viewBox="0 0 960 364" role="img" aria-label="Je m’appelle Kyliann, étudiant ingénieur en alternance au sein de FTEL, où j’interviens en tant que développeur React &amp; .NET. Passionné par le développement applicatif et la conception de services web robustes, j’aime comprendre en profondeur les systèmes que je construis et relever des défis techniques concrets. Mon parcours m’a permis de développer une forte capacité d’adaptation, une résistance au stress ainsi qu’un réel sens du travail en équipe. J’accorde une grande importance à la rigueur, au respect des bonnes pratiques et à la qualité du code, tout en restant attentif aux contraintes métiers, aux procédures et aux délais.">
